manifestVersion: 1
name: '@vcjdeboer/esp32'
version: 2026.09.12.1
description: >
  Drive ESP32 (and other MicroPython) boards from swamp over USB serial, no
  Arduino IDE. Two model types on a shared serial transport: `esp32-serial`
  (flash, REPL, a simple line protocol, WiFi/Bluetooth) and `uc2-device` (the
  UC2-ESP structured task protocol with qid/ACK/DONE). Every exchange is
  recorded as versioned data.
repository: 'https://github.com/vcjdeboer/esp32-serial'
license: MIT
models:
  - esp32_serial.ts
  - uc2_device.ts
workflows: []
vaults: []
drivers: []
datastores: []
reports: []
additionalFiles:
  - README.md
  - LICENSE
  - extensions/files/serial_worker.ts
binaries: []
dependencies: []
platforms:
  - darwin-aarch64
  - darwin-x86_64
  - linux-x86_64
  - linux-aarch64
